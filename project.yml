name: Rune

options:
  bundleIdPrefix: dev.rune
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "17"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Required for notarization; Rune needs no runtime exceptions.
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
  configs:
    Release:
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO
      # Ship without symbols: smaller, and harder to reverse engineer.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: non-global
      # Embedded frameworks come pre-signed (Sparkle); don't try to strip them.
      COPY_PHASE_STRIP: NO
      DEBUG_INFORMATION_FORMAT: dwarf
      # Skip the linker's ad-hoc signature; the release script signs after stripping.
      OTHER_LDFLAGS: "$(inherited) -Wl,-no_adhoc_codesign"
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  RuneKit:
    type: framework
    platform: macOS
    sources:
      - path: RuneKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rune.RuneKit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES

  Rune:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - Rune.entitlements
          - "ShellIntegration/**"
          - "Fonts/**"
      - path: Resources/ShellIntegration
        type: folder
        buildPhase: resources
      # Bundled fonts (SIL OFL), registered for the app by ATSApplicationFontsPath.
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - target: RuneKit
        embed: true
      - package: SwiftTerm
      - package: Sparkle
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Rune
        CFBundleDisplayName: Rune
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        ATSApplicationFontsPath: Fonts
        NSHumanReadableCopyright: "© 2026 Bryan Bernardo Parreira. All rights reserved."
        # In-app updates (Sparkle). The feed is the publisher's release channel; forks can
        # override RUNE_FEED_URL / RUNE_UPDATE_PUBLIC_KEY or leave them empty to disable updates.
        SUFeedURL: $(RUNE_FEED_URL)
        SUPublicEDKey: $(RUNE_UPDATE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUVerifyUpdateBeforeExtraction: true
        # macOS shows these when a command run in Rune asks for protected data or devices.
        NSDesktopFolderUsageDescription: Commands you run in Rune may read and write files on your Desktop.
        NSDocumentsFolderUsageDescription: Commands you run in Rune may read and write files in Documents.
        NSDownloadsFolderUsageDescription: Commands you run in Rune may read and write files in Downloads.
        NSRemovableVolumesUsageDescription: Commands you run in Rune may read and write files on external drives.
        NSNetworkVolumesUsageDescription: Commands you run in Rune may read and write files on network volumes.
        NSAppleEventsUsageDescription: A command you run in Rune wants to control another app.
        NSMicrophoneUsageDescription: A command you run in Rune wants to use the microphone.
        NSCameraUsageDescription: A command you run in Rune wants to use the camera.
        NSContactsUsageDescription: A command you run in Rune wants to access your contacts.
        NSCalendarsUsageDescription: A command you run in Rune wants to access your calendars.
        NSRemindersUsageDescription: A command you run in Rune wants to access your reminders.
        NSPhotoLibraryUsageDescription: A command you run in Rune wants to access your photos.
        NSLocationUsageDescription: A command you run in Rune wants to use your location.
        NSBluetoothAlwaysUsageDescription: A command you run in Rune wants to use Bluetooth.
        NSLocalNetworkUsageDescription: Rune connects to Ollama and other services on your local network when you use them.
        # Finder > right-click a folder > Services (Quick Actions).
        NSServices:
          - NSMenuItem: { default: New Rune Tab Here }
            NSMessage: newTabHere
            NSPortName: Rune
            NSRequiredContext: {}
            NSSendFileTypes: [public.folder]
          - NSMenuItem: { default: New Rune Window Here }
            NSMessage: newWindowHere
            NSPortName: Rune
            NSRequiredContext: {}
            NSSendFileTypes: [public.folder]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
        # rune://open?dir=…&command=… (Raycast, Alfred…): opens a tab, never runs anything.
        CFBundleURLTypes:
          - CFBundleURLName: dev.rune.open
            CFBundleURLSchemes: [rune]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rune.Rune
        CODE_SIGN_ENTITLEMENTS: Resources/Rune.entitlements
        PRODUCT_NAME: Rune
        RUNE_FEED_URL: https://github.com/BryanParreira/Rune/releases/latest/download/appcast.xml
        RUNE_UPDATE_PUBLIC_KEY: cHr50kOJ2kLrVtbwVnNzmRPNq/M9a7KEqpcpM7ks+ZA=
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          # The app executable exports nothing, so every symbol can go.
          STRIP_STYLE: all

  RuneKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # Tests live only in local checkouts (not published); the target builds empty without them.
      - path: Tests/RuneKitTests
        optional: true
    dependencies:
      - target: RuneKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rune.RuneKitTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Rune:
    build:
      targets:
        Rune: all
        RuneKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RuneKitTests
    archive:
      config: Release
